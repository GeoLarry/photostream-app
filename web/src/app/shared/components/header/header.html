<mat-toolbar color="primary" class="header-toolbar">
    <div class="nav-container">
        <a mat-flat-button routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active-nav-btn"
            class="nav-btn">
            📸 Photostream
        </a>

        <a mat-flat-button routerLink="/favorites" routerLinkActive="active-nav-btn" class="nav-btn">
            ❤️ Favorites
        </a>

        <div class="auth-nav">
            @if (user(); as user) {
                @if (canAdminUsers()) {
                    <a mat-flat-button routerLink="/admin/users" routerLinkActive="active-nav-btn" class="nav-btn">Admin</a>
                }
                <span class="user-name" [attr.aria-label]="'Signed in as ' + user.username">{{ user.firstName || user.username }}</span>
                <button mat-flat-button class="nav-btn" type="button" (click)="logout()">Log out</button>
            } @else {
                <a mat-flat-button routerLink="/login" routerLinkActive="active-nav-btn" class="nav-btn">Log in</a>
                <a mat-flat-button routerLink="/register" routerLinkActive="active-nav-btn" class="nav-btn">Sign up</a>
            }
        </div>
    </div>
</mat-toolbar>
