<div class="favorites-grid">
  @for (photo of favorites(); track photo.id) {
    <mat-card class="photo-card">
      <a class="card-link" [routerLink]="['/photos', photo.id]" [attr.aria-label]="'View photo by ' + photo.author">
        <img mat-card-image [ngSrc]="photo.id" width="600" height="400"
          [loaderParams]="{ width: 600, height: 400 }" [priority]="$index < 3" [alt]="photo.author">
      </a>
      <div class="card-overlay">
        <span class="author-name">{{ photo.author }}</span>
      </div>
    </mat-card>
  } @empty {
    <div class="empty-state">
      <div class="empty-icon">❤️</div>
      <h2>Your Favorites is empty</h2>
      <p>Explore the photostream to save your favorite photos!</p>
    </div>
  }
</div>
